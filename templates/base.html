<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}阪口源太 公式情報{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#0a0f1d'
                        },
                        brand: {
                            blue: '#1d4ed8',
                            emerald: '#059669',
                            orange: '#ea580c'
                        }
                    }
                }
            }
        }
    </script>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/2.1/sdk.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">
    <!-- Header -->
    <header class="bg-navy-950 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-brand-emerald flex items-center justify-center font-bold text-white text-sm">
                    源
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight">阪口 源太（さかぐち げんた）</h1>
                    <p class="text-xs text-slate-300">福井県高浜町｜安心を次世代へ</p>
                </div>
            </a>
            <span class="text-xs px-2 py-1 rounded bg-slate-800 text-emerald-400 font-semibold border border-emerald-500/30">
                公式Web
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-md mx-auto w-full px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-6 mt-8 border-t border-slate-800">
        <div class="max-w-md mx-auto px-4 text-center space-y-2">
            <p class="font-medium text-slate-300">阪口源太 後援会事務所</p>
            <p>福井県大飯郡高浜町 横津海（青郷地区）</p>
            <p class="text-[11px] text-slate-500">※本サイト・公式LINEは政治活動・政策広報を目的として運用されています。</p>
            <p class="text-[10px] text-slate-600 mt-2">© 2026-2027 Genta Sakaguchi Supporter Club.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
